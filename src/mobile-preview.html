<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Bloodiest — mobile preview</title>
<style>
  body { margin: 0; background: #2b2830; display: flex; justify-content: center; padding: 40px 0; font-family: "Segoe UI", sans-serif; }
  .phone { border: 12px solid #111; border-radius: 48px; overflow: hidden; background: #000; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
  .full .phone { border-radius: 24px; }
  iframe { display: block; width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>
<!-- ?page=landing.html&full=1 : iframe grows to the whole page height -->
<div class="phone"><iframe id="f" scrolling="no"></iframe></div>
<script>
  const q = new URLSearchParams(location.search), f = document.getElementById('f');
  f.src = q.get('page') || 'landing.html';
  if (q.get('full')) {
    document.body.classList.add('full');
    f.onload = () => setTimeout(() => { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px'; document.body.dataset.h = document.documentElement.scrollHeight; }, 1500);
  }
</script>
</body>
</html>
